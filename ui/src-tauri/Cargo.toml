[package]
name = "swarm-editor"
version = "0.1.0"
description = "Swarm Editor - Multi-agent collaborative development environment"
authors = ["Swarm Editor Team"]
license = "MIT"
repository = "https://github.com/swarm-editor/swarm-editor"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "swarm_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["full"] }
dirs = "5"
walkdir = "2"
chrono = "0.4"
